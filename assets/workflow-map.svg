<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ip-strategist unified task routing</title>
  <desc id="desc">A real request enters one unified entry point, selects one current task capsule, produces a deliverable, then waits for user feedback before routing again.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#10192d"/>
      <stop offset="1" stop-color="#172844"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#07101f" flood-opacity=".34"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7ed7c4"/>
    </marker>
    <style>
      .label{font:600 22px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f7fafc;text-anchor:middle}
      .sub{font:400 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#afbdd3;text-anchor:middle}
      .step{font:700 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#7ed7c4;letter-spacing:.08em;text-anchor:middle}
      .line{fill:none;stroke:#7ed7c4;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <g opacity=".15" fill="none" stroke="#7ed7c4">
    <circle cx="77" cy="66" r="36"/><circle cx="1108" cy="345" r="52"/>
    <path d="M25 318 C190 224 215 400 390 318 S690 230 845 318 S1040 391 1170 302"/>
  </g>
  <path class="line" d="M230 183 H302"/>
  <path class="line" d="M503 183 H575"/>
  <path class="line" d="M776 183 H848"/>
  <path class="line" d="M1007 243 C987 354 714 372 646 277"/>
  <g filter="url(#shadow)">
    <rect x="42" y="108" width="188" height="150" rx="22" fill="#223452" stroke="#536b91"/>
    <rect x="302" y="108" width="201" height="150" rx="22" fill="#2a4564" stroke="#6d8cae"/>
    <rect x="575" y="88" width="201" height="190" rx="28" fill="#285a5d" stroke="#7ed7c4" stroke-width="2"/>
    <rect x="848" y="108" width="188" height="150" rx="22" fill="#543d61" stroke="#9a73a4"/>
  </g>
  <text class="step" x="136" y="137">01</text><text class="label" x="136" y="181">真实任务</text><text class="sub" x="136" y="211">目标 · 材料 · 问题</text>
  <text class="step" x="402" y="137">02</text><text class="label" x="402" y="181">统一入口</text><text class="sub" x="402" y="211">判断唯一主任务</text>
  <text class="step" x="675" y="124">03</text><text class="label" x="675" y="172">一个任务胶囊</text><text class="sub" x="675" y="204">只加载当前判断</text><text class="sub" x="675" y="232">必要时局部查深层方法</text>
  <text class="step" x="942" y="137">04</text><text class="label" x="942" y="181">交付结果</text><text class="sub" x="942" y="211">完成当前一步</text>
  <text class="step" x="821" y="351">USER FEEDBACK · 用户反馈后重新判断</text>
</svg>
